{% extends "marco.html" %}
{% block titulo %}Inicio · App-EdiLoja{% endblock %}

{% block panel %}
<h1 class="ed-titulo-pagina">Hola, {{ usuario.nombres }}</h1>

<div class="ed-tarjeta" style="max-width:520px;">
  <p style="margin-top:0; font-size:var(--ed-size-sm);"><strong>Roles asignados</strong></p>
  <p>
    {% for v in usuario.roles %}
    <span class="ed-distintivo ed-distintivo--info">{{ v.rol.codigo }}</span>
    {% endfor %}
  </p>
  <p style="color:var(--ed-text-muted); font-size:var(--ed-size-sm); margin-bottom:0;">
    Su área de trabajo estará disponible próximamente.
  </p>
</div>
{% endblock %}
