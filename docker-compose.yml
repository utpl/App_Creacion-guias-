services:
  db:
    image: postgres:17-alpine
    container_name: ediloja-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ediloja
      POSTGRES_USER: ediloja_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
    ports:
      - "5436:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ediloja_app -d ediloja"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ediloja-redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  correo:
    image: axllent/mailpit:latest
    container_name: ediloja-correo
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  datos_postgres:
